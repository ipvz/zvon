<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="1200" height="240" rx="16" fill="#0E1615"/>
  <rect x="0.5" y="0.5" width="1199" height="239" rx="15.5" fill="none" stroke="#1B2524"/>

  <!-- step cards -->
  <g>
    <!-- 1 -->
    <rect x="30" y="44" width="240" height="152" rx="12" fill="#131D1C" stroke="#253130"/>
    <circle cx="66" cy="82" r="14" fill="#00C4C4"/><text x="66" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#04201F">1</text>
    <text x="50" y="128" font-size="15" font-weight="600" fill="#F2F5F4">Два источника</text>
    <text x="50" y="151" font-size="12" fill="#8B9A97">Микрофон — «Вы», система —</text>
    <text x="50" y="168" font-size="12" fill="#8B9A97">«Собеседник». Роли из источника.</text>

    <!-- 2 -->
    <rect x="330" y="44" width="240" height="152" rx="12" fill="#131D1C" stroke="#253130"/>
    <circle cx="366" cy="82" r="14" fill="#00C4C4"/><text x="366" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#04201F">2</text>
    <text x="350" y="128" font-size="15" font-weight="600" fill="#F2F5F4">Локально на устройстве</text>
    <text x="350" y="151" font-size="12" fill="#8B9A97">Parakeet TDT v3 распознаёт</text>
    <text x="350" y="168" font-size="12" fill="#8B9A97">речь. Аудио не покидает Mac.</text>

    <!-- 3 -->
    <rect x="630" y="44" width="240" height="152" rx="12" fill="#131D1C" stroke="#253130"/>
    <circle cx="666" cy="82" r="14" fill="#00C4C4"/><text x="666" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#04201F">3</text>
    <text x="650" y="128" font-size="15" font-weight="600" fill="#F2F5F4">Чистый транскрипт</text>
    <text x="650" y="151" font-size="12" fill="#8B9A97">Шум — прочь, неуверенное</text>
    <text x="650" y="168" font-size="12" fill="#8B9A97">чинит ИИ, термины — по словарю.</text>

    <!-- 4 -->
    <rect x="930" y="44" width="240" height="152" rx="12" fill="#131D1C" stroke="#253130"/>
    <circle cx="966" cy="82" r="14" fill="#00C4C4"/><text x="966" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#04201F">4</text>
    <text x="950" y="128" font-size="15" font-weight="600" fill="#F2F5F4">Итог и задачи</text>
    <text x="950" y="151" font-size="12" fill="#8B9A97">Тезисы, решения, вопросы.</text>
    <text x="950" y="168" font-size="12" fill="#8B9A97">Задачи — только по голосу.</text>
  </g>

  <!-- connectors -->
  <g fill="none" stroke="#00C4C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M294 112 l10 8 l-10 8"/>
    <path d="M594 112 l10 8 l-10 8"/>
    <path d="M894 112 l10 8 l-10 8"/>
  </g>
</svg>
