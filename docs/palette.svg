<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect x="0" y="0" width="760" height="470" rx="16" fill="#0E1615"/>
  <rect x="0.5" y="0.5" width="759" height="469" rx="15.5" fill="none" stroke="#1B2524"/>

  <!-- helper: swatch = chip + name + hex -->
  <!-- Group 1: Бренд -->
  <text x="32" y="46" font-size="12" letter-spacing="1.4" fill="#5B6866">БРЕНД</text>
  <g transform="translate(32,58)">
    <g><rect width="150" height="58" rx="10" fill="#00C4C4"/><text x="0" y="80" font-size="13" fill="#C3CECC">Accent · dark</text><text x="0" y="98" font-size="11.5" fill="#6C7A78" font-family="ui-monospace,Menlo,monospace">#00C4C4</text></g>
    <g transform="translate(174,0)"><rect width="150" height="58" rx="10" fill="#009798"/><text x="0" y="80" font-size="13" fill="#C3CECC">Accent · light</text><text x="0" y="98" font-size="11.5" fill="#6C7A78" font-family="ui-monospace,Menlo,monospace">#009798</text></g>
    <g transform="translate(348,0)"><rect width="150" height="58" rx="10" fill="#04201F"/><rect width="150" height="58" rx="10" fill="none" stroke="#253130"/><text x="0" y="80" font-size="13" fill="#C3CECC">On accent</text><text x="0" y="98" font-size="11.5" fill="#6C7A78" font-family="ui-monospace,Menlo,monospace">#04201F</text></g>
    <g transform="translate(522,0)"><rect width="150" height="58" rx="10" fill="#FF6B57"/><text x="0" y="80" font-size="13" fill="#C3CECC">Recording only</text><text x="0" y="98" font-size="11.5" fill="#6C7A78" font-family="ui-monospace,Menlo,monospace">#FF6B57</text></g>
  </g>

  <!-- Group 2: Поверхности (dark-first) -->
  <text x="32" y="196" font-size="12" letter-spacing="1.4" fill="#5B6866">ПОВЕРХНОСТИ · DARK-FIRST</text>
  <g transform="translate(32,208)">
    <g><rect width="150" height="58" rx="10" fill="#0A1110"/><rect width="150" height="58" rx="10" fill="none" stroke="#253130"/><text x="0" y="80" font-size="13" fill="#C3CECC">Sidebar</text><text x="0" y="98" font-size="11.5" fill="#6C7A78" font-family="ui-monospace,Menlo,monospace">#0A1110</text></g>
    <g transform="translate(174,0)"><rect width="150" height="58" rx="10" fill="#0E1615"/><rect width="150" height="58" rx="10" fill="none" stroke="#253130"/><text x="0" y="80" font-size="13" fill="#C3CECC">Canvas</text><text x="0" y="98" font-size="11.5" fill="#6C7A78" font-family="ui-monospace,Menlo,monospace">#0E1615</text></g>
    <g transform="translate(348,0)"><rect width="150" height="58" rx="10" fill="#131D1C"/><rect width="150" height="58" rx="10" fill="none" stroke="#253130"/><text x="0" y="80" font-size="13" fill="#C3CECC">Surface</text><text x="0" y="98" font-size="11.5" fill="#6C7A78" font-family="ui-monospace,Menlo,monospace">#131D1C</text></g>
    <g transform="translate(522,0)"><rect width="150" height="58" rx="10" fill="#1B2524"/><rect width="150" height="58" rx="10" fill="none" stroke="#253130"/><text x="0" y="80" font-size="13" fill="#C3CECC">Raised</text><text x="0" y="98" font-size="11.5" fill="#6C7A78" font-family="ui-monospace,Menlo,monospace">#1B2524</text></g>
  </g>

  <!-- Group 3: Текст и линии -->
  <text x="32" y="346" font-size="12" letter-spacing="1.4" fill="#5B6866">ТЕКСТ И ЛИНИИ</text>
  <g transform="translate(32,358)">
    <g><rect width="150" height="58" rx="10" fill="#F2F5F4"/><text x="0" y="80" font-size="13" fill="#C3CECC">Text</text><text x="0" y="98" font-size="11.5" fill="#6C7A78" font-family="ui-monospace,Menlo,monospace">#F2F5F4</text></g>
    <g transform="translate(174,0)"><rect width="150" height="58" rx="10" fill="#8B9A97"/><text x="0" y="80" font-size="13" fill="#C3CECC">Text · secondary</text><text x="0" y="98" font-size="11.5" fill="#6C7A78" font-family="ui-monospace,Menlo,monospace">#8B9A97</text></g>
    <g transform="translate(348,0)"><rect width="150" height="58" rx="10" fill="#6C7A78"/><text x="0" y="80" font-size="13" fill="#C3CECC">Text · tertiary</text><text x="0" y="98" font-size="11.5" fill="#6C7A78" font-family="ui-monospace,Menlo,monospace">#6C7A78</text></g>
    <g transform="translate(522,0)"><rect width="150" height="58" rx="10" fill="#253130"/><text x="0" y="80" font-size="13" fill="#C3CECC">Hairline</text><text x="0" y="98" font-size="11.5" fill="#6C7A78" font-family="ui-monospace,Menlo,monospace">#253130</text></g>
  </g>
</svg>
