name: Parley
options:
  bundleIdPrefix: com.parley
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"            # 6.2 toolchain, language mode 5 (relax strict concurrency)
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    # Stable self-signed identity ("Parley Dev Cert" in the login keychain) so the code
    # signature — and therefore TCC permissions (Screen Recording / Mic) — persist across
    # rebuilds instead of re-prompting every time (ad-hoc "-" changes hash each build).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Parley Dev Cert"
    DEVELOPMENT_TEAM: ""
    OTHER_CODE_SIGN_FLAGS: "--deep"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: "1.0.0"
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.12.4"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "1.9.0"

targets:
  Parley:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parley.app
        PRODUCT_NAME: Parley
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Parley.entitlements
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: KeyboardShortcuts
